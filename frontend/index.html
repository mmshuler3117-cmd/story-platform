<!DOCTYPE html>
<html>
<head>
  <title>Story App</title>
  <style>
    body {
      font-family: Georgia, serif;
      max-width: 750px;
      margin: 40px auto;

      background:
        radial-gradient(circle at 20% 20%, rgba(255,255,255,0.04), transparent 40%),
        radial-gradient(circle at 80% 80%, rgba(0,0,0,0.25), transparent 50%),
        linear-gradient(135deg, #2b1d17, #3a2620, #1e1410);

        color: #f5f1e8;
    }

    h1 {
      text-align: center;
      color: #e8d8c3; /* warm light beige*/
      letter-spacing: 1px;
      text-shadow: 0 0 6px rgba(255, 220, 150, 0.2);
    }

    h2, h3 {
      color: #d6c2a8;
    }

    .bookshelf {
      display: flex;
      background: linear-gradient(to bottom, #3e2c23, #2b1d17);
      flex-wrap: wrap;
      gap: 14px;
      padding: 20px;
      margin: 14px 0;
      border-radius: 12px;
      box-shadow: inset 0 0 10px rgba(0,0,0,0.4);
    }

    .book {
      width: 60px;
      height: 180px;
      background: linear-gradient(to bottom, #6b3f2a, #4a2b1d);
      border-radius: 4px;
      writing-mode: vertical-rl;
      text-orientation: mixed;
      color: #f4f1ea;
      font-size: 14px;
      padding: 8px 4px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s ease;
      box-shadow:
        inset 0 0 6px rgba(255,255,255,0.05),
        2px 2px 6px rgba(0,0,0,0.4);
    }

    .book:hover {
      transform: translateY(-6px) scale(1.05);
      background: linear-gradient(to bottom, #5a3a2a, #3b2418);
    }

    .book:nth-child(3n) {
      background: linear-gradient(to bottom, #7a4a32, #4a2b1d);
    }

    input, textarea {
      width: 100%;
      padding: 10px;
      margin: 6px 0;

      border-radius: 6px;
      border: 1px solid #b8a48c;

      background: #fdf6e3;
      color: #2b2b2b;

      font-family: Georgia, serif;
    }

    input:focus, textarea:focus {
      outline: none;
      border-color: #8b5e3c;
      box-shadow: 0 0 6px rgba(139, 94, 60, 0.3);
    }

    button {
      padding: 10px 14px;
      margin-top: 8px;
      border: none;
      border-radius: 6px;
      cursor: pointer;

      background: #5a3825;
      color: #f5f1e8;

      font-family: georgia, serif;
      transition: all 0.2s ease;
    }

    button:active {
      transform: scale(0.98);
    }

    button:hover {
      background: #7a4a30;
      transform: translate(-1px);
    }

    .story-title {
      font-weight: bold;
      font-size: 18px;
      color: #3b2f2f;
    }

    .story-content {
      margin-top: 6px;
      line-height: 1.4;
    }

    button.delete {
      background: #6e1a1a;
    }

    button.delete:hover {
      background: #922222;
    }

    .editor {
      background: #fdf6e3;
      color: #2b2b2b;
      padding: 16px;
      border-radius: 10px;
      border: 1px solid #c9b8a6;
      margin-bottom: 20px;
    }

    .reader {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;

      background: rgba(20, 12, 8, 0.95);
      color: #f5f1e8;

      display: flex;
      flex-direction: colunm;
      justify-content: center;
      align-items: center;

      padding: 40px;
    }

    .reader-content {
      max-width: 600px;
      background: #fdf6e3;
      color: #2b2b2b;

      padding: 20px;
      border-radius: 10px;

      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }

    .hidden {
      display: none;
    }

    .close-btn {
      margin-top: 20px;
      background: #6e1a1a;
    }
  </style>
</head>
<body>

  <h1>My Story App</h1>

  <div id="reader" class="reader hidden"></div>

  <h2>Create Story</h2>

  <div class="editor">
    <h3>Create a Story</h3>
    <input id="title" placeholder="Title"/>
    <textarea id="content" placeholder="Write your Story..."></textarea>
    <button onclick="submitStory()">Submit Story</button>
    <button onclick="loadStories()">Open Library</button>
    
  </div>

  <div id="stories" class="bookshelf"></div>

  <script>
    const API = "http://localhost:8000";


    function openStory(story) {
      const reader = document.getElementById("reader");

      reader.innerHTML = `
      <div class="reader-content">
        <h2>${story.title}</h2>
        <p>${story.content}</p>
        <button class="close-btn" onclick="closeReader()">Close</button>
      </div>
    `;

    reader.classList.remove("hidden");
    }

    function closeReader() {
      document.getElementById("reader").classList.add("hidden");
    }

    async function submitStory() {
      const title = document.getElementById("title").value;
      const content = document.getElementById("content").value;

      await fetch(`${API}/stories`, {
        method: "POST",
        headers: {"Content-Type": "application/json" },
        body: JSON.stringify({ title, content })
      });

      document.getElementById("title").value = "";
      document.getElementById("content").value = "";

      loadStories();
    }

    async function loadStories() {
      const res = await fetch(`${API}/stories`);
      const data = await res.json();

      const container = document.getElementById("stories");
      container.innerHTML = "";

     if (data.length === 0) {
        container.innerHTML = `
          <p style="text-align:center; color:#777; font-style:italic;">
            The library is closed. Open it to view stories.
          </p>
        `;
        return;
      }

      data.forEach((story, index) => {
        const div = document.createElement("div");
      div.className = "book";

      div.style.opacity = 0;
      div.style.transition = "opacity 0.4s ease";

      div.onclick = () => openStory(story);
        // title
        const title =document.createElement("div");
        title.textContent = (story.is_favorite ? "⭐ ": "") + story.title;

        //start button
        const starBtn = document.createElement("button");
        starBtn.textContent = "⭐";

        starBtn.onclick = async (e) => {
          e.stopPropagation();

          await fetch(`${API}/stories/${story.id}/favorite`, {
            method: "PATCH"
          });

  loadStories();
};

//delete button
const deleteBtn = document.createElement("button");
deleteBtn.textContent = "Remove";
deleteBtn.className = "delete";

deleteBtn.onclick = async (e) => {
  e.stopPropagation();

  await fetch(`${API}/stories/${story.id}`, {
    methond: "delete"
  });

  loadStories()
};

// build order
div.appendChild(title);
div.appendChild(starBtn);
div.appendChild(deleteBtn);

document.getElementById("stories").appendChild(div);

setTime(() => {
  div.style.opacity = 1;
}, 50 * index);
});

      div.innerHTML = `
        <div>
          ${story.is_favorite ? "⭐ " : ""}
          ${story.title}
         </div>
         <button class="delete">Remove</button>
      `;

      div.querySelector(".delete").onclick = (e) => {
        e.stopPropagation();
        deleteStory(story.id);
      }

    container.appendChild(div);

    // fade in after DOM insertion
    setTimeout(() => {
      div.style.opacity = 1;
    }, 50 * index);
  });
    }

    async function deleteStory(id) {
      console.log("Deleting:", id);

      const res = await fetch(`${API}/stories/${id}`, {
        method: "DELETE"
      });

      const data = await res.json();
      console.log(data);

      loadStories();
    }

  </script>
  
</body>
</html>
