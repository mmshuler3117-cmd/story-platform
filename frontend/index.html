<!DOCTYPE html>
<html>
<head>
  <title>Story App</title>
  <style>
    body {
      font-family: Georgia, serif;
      max-width: 750px;
      margin: 40px auto;
      background: linear-gradient(145deg, #2c1f1a, #3a2a24); /* leather brown*/
      color: #f5eee6; /* off white text*/
    }

    h1 {
      text-align: center;
      color: #e8d8c3; /* warm light beige*/
      letter-spacing: 1px;
    }

    .card {
      background: #f8f3ea; /*warm paper*/
      padding: 16px;
      margin: 12px 0;
      border-radius: 10px;
      border: 1px solid #5a3e36;
      box-shadow: 0 2px 6px rgba(0,0,0,0.25);
      transition: all 0.25s ease;
    }

    .card:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 14px rgba(0,0,0,0.12);
    }

    input, textarea {
      width: 100%;
      padding: 10px;
      margin: 6px 0;
      border-radius: 6px;
      border: 1px solid #c9b8a6;
      background: #fffdf8;
      font-family: Georgia, serif;
    }

    input:focus, textarea:focus {
      outline: none;
      border-color: #8b5e3c;
      box-shadow: 0 0 5px rgba(139, 94, 60, 0.2);
    }

    button {
      padding: 10px 14px;
      margin-top: 8px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      background: #6b3f2a;
      color: #fff;
      font-family: georgia, serif;
      transition: 0.2s;
    }

    button:active {
      transform: scale(0.98);
    }

    button:hover {
      background: #8b4a2f;
      transform: translate(-1px);
    }

    .story-title {
      font-weight: bold;
      font-size: 18px;
      color: #3b2f2f;
    }

    .story-content {
      margin-top: 6px;
      line-height: 1.4;
    }

    button.delete {
      background: #8b1e1e;
      margin-top: 10px;
    }

    button.delete:hover {
      background: #a52a2a;
    }
  </style>
</head>
<body>

  <h1>My Story App</h1>

  <h2>Create Story</h2>

  <div class="card">
    <h3>Create a Story</h3>
    <input id="title" placeholder="Title"/>
    <textarea id="content" placeholder="Write your Story..."></textarea>
    <button onclick="submitStory()">Submit Story</button>
    <button onclick="loadStories()">Load Stories</button>
    
  </div>

  <div id="stories"></div>

  <script>
    const API = "http://localhost:8000";

    async function submitStory() {
      const title = document.getElementById("title").value;
      const content = document.getElementById("content").value;

      await fetch(`${API}/stories`, {
        method: "POST",
        headers: {"Content-Type": "application/json" },
        body: JSON.stringify({ title, content })
      });

      document.getElementById("title").value = "";
      document.getElementById("content").value = "";

      loadStories();
    }

    async function loadStories() {
      const res = await fetch(`${API}/stories`);
      const data = await res.json();

      const container = document.getElementById("stories");
      container.innerHTML = "";

      if (data.length === 0) {
        container.innerHTML = "<p style='text-align:center; color:#777;'>No Stories yet... your library is empty.</p>";
        return;
      }

      data.forEach((story, index) => {
        const div = document.createElement("div");
        div.className="card";

        div.innerHTML = `
          <div class="story-title">${story.title}</div>
          <div class="story-content">${story.content}</div>
          <button class="delete" onclick="deleteStory(${index})">Remove</button>
        `;

        container.appendChild(div);
      });
    }

    async function deleteStory(index) {
      console.log("Deleting:", index);

      const res = await fetch(`${API}/stories/${index}`, {
        method: "DELETE"
      });

      const data = await res.json();
      console.log(data);

      loadStories();
    }

  loadStories();
  </script>
  
</body>
</html>
